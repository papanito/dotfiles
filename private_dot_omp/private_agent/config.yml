providers:
  webSearch: gemini
symbolPreset: unicode
theme:
  dark: titanium
setupVersion: 1
# Startup Default — Ollama Cloud first, everything else is fallback
default_model: "ollama-cloud/glm-5.2"

# Failover Matrix: Ollama Cloud ──► Gemini ──► Alibaba Token Plan ──► OpenRouter Free ──► OmniRoute
# NOTE: Gemini is rate-limited on the free tier — it's a pass-through, not a destination.
# NOTE: Alibaba Token Plan backs Gemini — qwen3.7-plus keeps vision, qwen3.7-max keeps deep reasoning.
# NOTE: OpenRouter paid models (gpt-5.4) excluded from routing — available via manual switch only.
# NOTE: Local llama.cpp and local ollama hardware models removed; cloud providers only.
fallbackModel:
  # Tier 1 Ollama Cloud fails over into Gemini
  "ollama-cloud/glm-5.2": "google/gemini-2.5-flash"
  "ollama-cloud/deepseek-v4-pro": "google/gemini-2.5-flash"
  "ollama-cloud/kimi-k2.7-code": "google/gemini-2.5-flash"
  "ollama-cloud/qwen3-coder-next": "google/gemini-2.5-flash"
  "ollama-cloud/gpt-oss:20b": "google/gemini-2.5-flash"
  "ollama-cloud/gemini-3-flash-preview": "google/gemini-2.5-flash"

  # Gemini (rate-limited) hands off to Alibaba Token Plan
  "google/gemini-2.5-flash": "alibaba-token-plan/qwen3.7-plus"
  "google/gemini-2.5-pro": "alibaba-token-plan/qwen3.7-max"

  # Alibaba hands off to OpenRouter Free
  "alibaba-token-plan/glm-5.2": "openrouter/openai/gpt-oss-20b:free"
  "alibaba-token-plan/qwen3.7-max": "openrouter/openai/gpt-oss-20b:free"
  "alibaba-token-plan/qwen3.7-plus": "openrouter/openai/gpt-oss-20b:free"
  "alibaba-token-plan/deepseek-v4-pro": "openrouter/openai/gpt-oss-20b:free"

  # OpenRouter Free fails over into OmniRoute last-resort
  "openrouter/openai/gpt-oss-20b:free": "omniroute/free-forever"
  "openrouter/cohere/north-mini-code:free": "omniroute/free-forever"
  "omniroute/free-forever": "omniroute/auto/best-free"
  "omniroute/auto/coding:free": "omniroute/auto/best-free"
  "omniroute/auto/cheap": "omniroute/auto/best-free"

# Subagent Task Assignments (Primary: Ollama Cloud)
modelRoles:
  default: "ollama-cloud/glm-5.2" # Interactive session — primary engine
  smol: "ollama-cloud/qwen3-coder-next" # Quick mechanical subagents — fast coder
  slow: "ollama-cloud/deepseek-v4-pro" # Deep reasoning
  vision: "ollama-cloud/gemini-3-flash-preview" # Image inputs — multimodal
  plan: "ollama-cloud/deepseek-v4-pro" # Architecture proposals
  designer: "ollama-cloud/kimi-k2.7-code" # UI/UX specialist — code + image input
  commit: "ollama-cloud/gpt-oss:20b" # Commit message generation — small and fast
  task: "ollama-cloud/glm-5.2" # General-purpose subagents
  advisor: "ollama-cloud/deepseek-v4-pro" # Oracle/consultation

agent:
  reasoning_effort: "high"
  interactive: true # Standard permission gate before executing local commands
  max_iterations: 12

code:
  style: "functional"
  include_comments: true
  framework_preferences:
    terraform: ">= 5.0"
    python: "3.11"
    go: "1.22"
    typescript: "bun" # Prefers lightweight runtimes for infrastructure scripts
personality: pragmatic
rules:
  autoConnectLsp: true
  trackModelConsumption: true
statusLine:
  preset: full
  sessionAccent: true
tui:
  textSizing: true
display:
  shimmer: classic
  smoothStreaming: true
  showTokenUsage: true
startup:
  checkUpdate: false
memory:
  backend: local
renderMermaid:
  enabled: false
github:
  enabled: true
hideThinkingBlock: true
autolearn:
  enabled: true
task:
  isolation:
    mode: auto
autoResume: true
autocompleteMaxVisible: 10
dev:
  autoqa: false

