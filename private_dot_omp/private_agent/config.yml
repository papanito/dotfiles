providers:
  webSearchOrder:
    - gemini
    - perplexity
    - anthropic
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
  autoThinkingMaxEffort: "medium" # ADDED: Caps background reasoning effort from xhigh to medium

symbolPreset: unicode
theme:
  dark: titanium
setupVersion: 1

agent:
  reasoning_effort: "auto"
  interactive: true # Standard permission gate before executing local commands
  max_iterations: 12

code:
  style: "functional"
  include_comments: true
  framework_preferences:
    terraform: ">= 5.0"
    python: "3.11"
    go: "1.22"
    typescript: "bun" # Prefers lightweight runtimes for infrastructure scripts
personality: pragmatic
textVerbosity: low # ADDED: Forces short, concise model output to save generation tokens

rules:
  autoConnectLsp: true
  trackModelConsumption: true
statusLine:
  preset: full
  sessionAccent: true
tui:
  textSizing: true
display:
  shimmer: classic
  smoothStreaming: true
  showTokenUsage: true
startup:
  checkUpdate: false
memory:
  backend: local
renderMermaid:
  enabled: false
github:
  enabled: true
images:
  describeForTextModels: false # ADDED: Stops background image-to-text token processing

hideThinkingBlock: true
autolearn:
  enabled: true
task:
  isolation:
    mode: auto
  eager: preferred
  maxEffort: "medium" # ADDED: Prevents subagent tasks from generating huge thinking traces

autoResume: true
autocompleteMaxVisible: 10
dev:
  autoqa: false
defaultThinkingLevel: low # OPTIMIZED: Changed from 'auto' to 'low' to cap routine thinking tokens
proseOnlyThinking: true
omitThinking: true
checkpoint:
  enabled: true

compaction:
  strategy: snapcompact
  handoffSaveToDisk: true
  keepRecentTokens: 8000 # ADDED: Reduces active uncompressed context window from 20000 to 8000
  supersedeReads: true # ADDED: Drops outdated file read buffers when re-read
  dropUseless: true # ADDED: Purges uninformative tool execution turns from context

snapcompact:
  toolResults: true # ADDED: Enables compression for tool execution logs
  systemPrompt: "agents-md" # ADDED: Trims static system prompt overhead

files:
  read:
    defaultLimit: 150 # ADDED: Halves default file read limit (from 300) to shrink payloads

tools:
  artifactTailLines: 150 # ADDED: Restricts command stdout/stderr capture size in context

grep:
  contextAfter: 1 # ADDED: Cuts search result context lines to shrink grep payloads
