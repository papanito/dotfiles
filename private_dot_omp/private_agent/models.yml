# =======================================================
# ⚙️ MODEL ROUTING & SUBAGENT ROLES
# =======================================================
default_model: "ollama-cloud/deepseek-v4.1-flash"

fallbackModel:
  "ollama-cloud/deepseek-v4.1-flash": "google-antigravity/gemini-2.5-flash"
  "ollama-cloud/glm-5.2": "google-antigravity/gemini-2.5-flash"
  "ollama-cloud/deepseek-v4-pro": "google-antigravity/gemini-2.5-flash"

  "google-antigravity/gemini-2.5-flash": "mistral-ai/codestral-latest"
  "google-antigravity/gemini-2.5-pro": "mistral-ai/codestral-latest"

  "mistral-ai/codestral-latest": "openrouter/openai/gpt-oss-20b:free"
  "openrouter/openai/gpt-oss-20b:free": "cloudflare-workers-ai/@cf/meta/llama-3.1-8b-instruct"
  "cloudflare-workers-ai/@cf/meta/llama-3.1-8b-instruct": "omniroute/free-forever"
  "omniroute/free-forever": "omniroute/auto/best-free"

modelRoles:
  default: "ollama-cloud/deepseek-v4.1-flash"
  smol: "cloudflare-workers-ai/@cf/meta/llama-3.2-3b-instruct"
  slow: "ollama-cloud/deepseek-v4-pro"
  vision: "ollama-cloud/gemini-3-flash-preview"
  plan: "ollama-cloud/deepseek-v4-pro"
  designer: "ollama-cloud/kimi-k2.7-code"
  commit: "cloudflare-workers-ai/@cf/meta/llama-3.2-3b-instruct"
  task: "mistral-ai/codestral-latest"
  advisor: "ollama-cloud/deepseek-v4-pro"
